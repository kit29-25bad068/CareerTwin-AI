<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - CareerTwin AI</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: radial-gradient(circle at 50% 30%, rgba(99, 102, 241, 0.12) 0%, transparent 60%);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="card auth-card card-glow">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 48px; height: 48px; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.4rem; margin: 0 auto 1rem;">CT</div>
        <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">Welcome Back</h1>
        <p style="font-size: 0.9rem;">Sign in to access your evolving Digital Career Twin.</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address or GitHub Username <span style="color: #ef4444; font-weight: 700;">*</span></label>
          <input type="text" id="email" class="form-input" placeholder="you@university.edu or github-username" required autocomplete="username">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
            <label class="form-label" for="password" style="margin-bottom: 0;">Password <span style="color: #ef4444; font-weight: 700;">*</span></label>
            <a href="/forgot-password.html" style="font-size: 0.8rem; color: var(--accent-primary); text-decoration: none; font-weight: 500;">Forgot password?</a>
          </div>
          <div style="position: relative; display: flex; align-items: center;">
            <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" style="padding-right: 42px;">
            <button type="button" id="toggle-password-btn" title="Toggle password visibility" aria-label="Toggle password visibility" style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: var(--text-secondary); font-size: 1.15rem; padding: 4px; display: flex; align-items: center; justify-content: center; outline: none;">
              <span id="toggle-password-icon">👁️</span>
            </button>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
          Sign In
        </button>
      </form>

      <!-- Or continue with divider -->
      <div style="display: flex; align-items: center; margin: 1.25rem 0; color: var(--text-muted); font-size: 0.8rem;">
        <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
        <span style="padding: 0 0.75rem; text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em;">Or continue with</span>
        <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
      </div>

      <!-- Sign in with Google Button -->
      <button type="button" id="google-signin-btn" class="btn btn-secondary btn-lg" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.75rem; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-color); color: var(--text-primary); font-weight: 600; cursor: pointer; transition: all 0.2s ease;">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Sign in with Google</span>
      </button>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-secondary); border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
        Don't have an account yet? <a href="/register.html" style="font-weight: 600;">Create Account</a>
      </div>
    </div>
  </div>

  <!-- Google Sign-In Account Selector Modal -->
  <div id="google-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); z-index: 10000; align-items: center; justify-content: center; padding: 1.5rem;">
    <div class="card card-glow" style="width: 100%; max-width: 400px; padding: 2rem; position: relative;">
      <button type="button" id="close-google-modal" style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer;">✕</button>
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <svg width="36" height="36" viewBox="0 0 24 24" style="margin-bottom: 0.5rem;">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <h3 style="font-size: 1.25rem; margin-bottom: 0.25rem;">Sign in with Google</h3>
        <p style="font-size: 0.85rem; color: var(--text-secondary);">Choose your Google account to access CareerTwin AI</p>
      </div>

      <!-- Quick Demo / Student Accounts -->
      <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.25rem;">
        <button type="button" class="btn btn-secondary google-account-option" data-email="alex.chen@gmail.com" data-name="Alex Chen" style="display: flex; align-items: center; justify-content: flex-start; gap: 0.75rem; padding: 0.65rem 0.85rem; text-align: left; width: 100%;">
          <div style="width: 32px; height: 32px; border-radius: 50%; background: #4285F4; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem;">A</div>
          <div style="flex: 1; min-width: 0;">
            <div style="font-weight: 600; font-size: 0.85rem; color: #fff;">Alex Chen</div>
            <div style="font-size: 0.75rem; color: var(--text-muted); text-overflow: ellipsis; overflow: hidden;">alex.chen@gmail.com</div>
          </div>
        </button>

        <button type="button" class="btn btn-secondary google-account-option" data-email="developer.candidate@gmail.com" data-name="Developer Candidate" style="display: flex; align-items: center; justify-content: flex-start; gap: 0.75rem; padding: 0.65rem 0.85rem; text-align: left; width: 100%;">
          <div style="width: 32px; height: 32px; border-radius: 50%; background: #34A853; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem;">D</div>
          <div style="flex: 1; min-width: 0;">
            <div style="font-weight: 600; font-size: 0.85rem; color: #fff;">Developer Candidate</div>
            <div style="font-size: 0.75rem; color: var(--text-muted); text-overflow: ellipsis; overflow: hidden;">developer.candidate@gmail.com</div>
          </div>
        </button>
      </div>

      <div style="display: flex; align-items: center; margin: 1rem 0; color: var(--text-muted); font-size: 0.75rem;">
        <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
        <span style="padding: 0 0.5rem;">OR ENTER GOOGLE EMAIL</span>
        <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
      </div>

      <!-- Custom Google Email Input -->
      <form id="google-custom-form" style="display: flex; flex-direction: column; gap: 0.75rem;">
        <input type="email" id="google-custom-email" class="form-input" placeholder="your.name@gmail.com" required style="font-size: 0.88rem;">
        <button type="submit" id="btn-submit-google-custom" class="btn btn-cyan" style="width: 100%;">
          Continue with this Google Account
        </button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Clear any stale/expired session on login page
    API.setToken(null);
    API.setUser(null);

    // Password visibility toggle
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('toggle-password-btn');
    const togglePasswordIcon = document.getElementById('toggle-password-icon');

    if (togglePasswordBtn && passwordInput) {
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        togglePasswordIcon.textContent = isPassword ? '🙈' : '👁️';
        togglePasswordBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      });
    }

    // Google Sign-In Modal handlers
    const googleBtn = document.getElementById('google-signin-btn');
    const googleModal = document.getElementById('google-modal');
    const closeGoogleModal = document.getElementById('close-google-modal');

    if (googleBtn && googleModal) {
      googleBtn.addEventListener('click', () => {
        googleModal.style.display = 'flex';
      });
    }

    if (closeGoogleModal && googleModal) {
      closeGoogleModal.addEventListener('click', () => {
        googleModal.style.display = 'none';
      });
      googleModal.addEventListener('click', (e) => {
        if (e.target === googleModal) googleModal.style.display = 'none';
      });
    }

    async function handleGoogleLogin(email, name) {
      try {
        Utils.showLoading('Signing in with Google...');
        const res = await API.post('/auth/google', {
          email,
          name: name || email.split('@')[0],
          googleId: 'g_' + btoa(email).replace(/=/g, '').slice(0, 16),
        });

        Utils.hideLoading();
        if (res.success && res.token) {
          API.setToken(res.token);
          API.setUser(res.user);
          Utils.showToast(`Welcome back, ${res.user.name || 'User'}! Signed in with Google.`, 'success');

          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get('redirect') || '/dashboard.html';
          setTimeout(() => {
            window.location.href = redirect;
          }, 600);
        }
      } catch (err) {
        Utils.hideLoading();
        Utils.showToast(err.message || 'Google sign-in failed. Please try again.', 'error');
      }
    }

    // Quick Google Account Click
    document.querySelectorAll('.google-account-option').forEach((btn) => {
      btn.addEventListener('click', () => {
        const email = btn.getAttribute('data-email');
        const name = btn.getAttribute('data-name');
        if (email) handleGoogleLogin(email, name);
      });
    });

    // Custom Google Email Submission
    const googleCustomForm = document.getElementById('google-custom-form');
    if (googleCustomForm) {
      googleCustomForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const customEmail = document.getElementById('google-custom-email').value.trim();
        if (customEmail) {
          handleGoogleLogin(customEmail, customEmail.split('@')[0]);
        }
      });
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submit-btn');

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';

        const data = await API.post('/auth/login', { email, password });
        if (data.success && data.token) {
          API.setToken(data.token);
          API.setUser(data.user);
          Utils.showToast('Login successful! Redirecting...', 'success');
          
          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get('redirect') || '/dashboard.html';
          setTimeout(() => {
            window.location.href = redirect;
          }, 800);
        }
      } catch (err) {
        Utils.showToast(err.message || 'Login failed. Please check your credentials.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>

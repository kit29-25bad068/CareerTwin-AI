<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - CareerTwin AI</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: radial-gradient(circle at 50% 30%, rgba(99, 102, 241, 0.12) 0%, transparent 60%);
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
    }
    .strength-meter {
      height: 4px;
      background: var(--bg-tertiary, #1f293d);
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
      display: flex;
      gap: 3px;
    }
    .strength-segment {
      flex: 1;
      height: 100%;
      background: transparent;
      transition: background 0.3s ease;
      border-radius: 2px;
    }
    .strength-text {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 4px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="card auth-card card-glow">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 48px; height: 48px; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.4rem; margin: 0 auto 1rem;">CT</div>
        <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">Set New Password</h1>
        <p style="font-size: 0.9rem; color: var(--text-secondary);">Choose a strong, secure password for your CareerTwin account.</p>
      </div>

      <div id="missing-token-alert" style="display: none; padding: 1rem; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: var(--radius-md); margin-bottom: 1.5rem; font-size: 0.875rem;">
        ⚠️ Reset token is missing or invalid in the URL. 
        <a href="/forgot-password.html" style="color: var(--accent-primary); font-weight: 600; text-decoration: underline; margin-left: 4px;">Request a new link</a>
      </div>

      <form id="reset-form">
        <div class="form-group">
          <label class="form-label" for="new-password">New Password <span style="color: #ef4444; font-weight: 700;">*</span></label>
          <div style="position: relative; display: flex; align-items: center;">
            <input type="password" id="new-password" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6" autofocus style="padding-right: 42px;">
            <button type="button" id="toggle-new-password-btn" title="Toggle password visibility" aria-label="Toggle password visibility" style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: var(--text-secondary); font-size: 1.15rem; padding: 4px; display: flex; align-items: center; justify-content: center; outline: none;">
              <span id="toggle-new-password-icon">👁️</span>
            </button>
          </div>
          <div class="strength-meter">
            <div id="str-1" class="strength-segment"></div>
            <div id="str-2" class="strength-segment"></div>
            <div id="str-3" class="strength-segment"></div>
          </div>
          <span id="strength-label" class="strength-text">Password strength: too short</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm New Password <span style="color: #ef4444; font-weight: 700;">*</span></label>
          <div style="position: relative; display: flex; align-items: center;">
            <input type="password" id="confirm-password" class="form-input" placeholder="Repeat your new password" required autocomplete="new-password" minlength="6" style="padding-right: 42px;">
            <button type="button" id="toggle-confirm-password-btn" title="Toggle password visibility" aria-label="Toggle password visibility" style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: var(--text-secondary); font-size: 1.15rem; padding: 4px; display: flex; align-items: center; justify-content: center; outline: none;">
              <span id="toggle-confirm-password-icon">👁️</span>
            </button>
          </div>
          <span id="match-error" style="display: none; color: #ef4444; font-size: 0.75rem; margin-top: 4px;">Passwords do not match.</span>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
          Update Password
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-secondary); border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
        Never mind? <a href="/login.html" style="font-weight: 600;">Back to Sign In</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const missingAlert = document.getElementById('missing-token-alert');
    const resetForm = document.getElementById('reset-form');
    const newPasswordInput = document.getElementById('new-password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const matchError = document.getElementById('match-error');
    const submitBtn = document.getElementById('submit-btn');

    const str1 = document.getElementById('str-1');
    const str2 = document.getElementById('str-2');
    const str3 = document.getElementById('str-3');
    const strengthLabel = document.getElementById('strength-label');

    if (!token) {
      missingAlert.style.display = 'block';
    }

    // Password visibility toggles
    const toggleNewPasswordBtn = document.getElementById('toggle-new-password-btn');
    const toggleNewPasswordIcon = document.getElementById('toggle-new-password-icon');
    if (toggleNewPasswordBtn && newPasswordInput) {
      toggleNewPasswordBtn.addEventListener('click', () => {
        const isPassword = newPasswordInput.type === 'password';
        newPasswordInput.type = isPassword ? 'text' : 'password';
        toggleNewPasswordIcon.textContent = isPassword ? '🙈' : '👁️';
        toggleNewPasswordBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      });
    }

    const toggleConfirmPasswordBtn = document.getElementById('toggle-confirm-password-btn');
    const toggleConfirmPasswordIcon = document.getElementById('toggle-confirm-password-icon');
    if (toggleConfirmPasswordBtn && confirmPasswordInput) {
      toggleConfirmPasswordBtn.addEventListener('click', () => {
        const isPassword = confirmPasswordInput.type === 'password';
        confirmPasswordInput.type = isPassword ? 'text' : 'password';
        toggleConfirmPasswordIcon.textContent = isPassword ? '🙈' : '👁️';
        toggleConfirmPasswordBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      });
    }

    // Interactive password strength calculation
    newPasswordInput.addEventListener('input', () => {
      const val = newPasswordInput.value;
      let score = 0;

      if (val.length >= 6) score++;
      if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val) || val.length >= 10) score++;

      str1.style.background = score >= 1 ? (score === 1 ? '#ef4444' : (score === 2 ? '#f59e0b' : '#10b981')) : 'transparent';
      str2.style.background = score >= 2 ? (score === 2 ? '#f59e0b' : '#10b981') : 'transparent';
      str3.style.background = score >= 3 ? '#10b981' : 'transparent';

      if (val.length < 6) {
        strengthLabel.textContent = 'Password strength: too short (min 6 chars)';
        strengthLabel.style.color = 'var(--text-secondary)';
      } else if (score === 1) {
        strengthLabel.textContent = 'Password strength: Weak (add numbers & uppercase)';
        strengthLabel.style.color = '#ef4444';
      } else if (score === 2) {
        strengthLabel.textContent = 'Password strength: Medium';
        strengthLabel.style.color = '#f59e0b';
      } else {
        strengthLabel.textContent = 'Password strength: Strong ✓';
        strengthLabel.style.color = '#10b981';
      }

      checkMatch();
    });

    confirmPasswordInput.addEventListener('input', checkMatch);

    function checkMatch() {
      if (confirmPasswordInput.value && newPasswordInput.value !== confirmPasswordInput.value) {
        matchError.style.display = 'block';
      } else {
        matchError.style.display = 'none';
      }
    }

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!token) {
        Utils.showToast('Reset token is missing. Please request a new reset link.', 'error');
        return;
      }

      const password = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (password.length < 6) {
        Utils.showToast('Password must be at least 6 characters.', 'error');
        return;
      }

      if (password !== confirmPassword) {
        Utils.showToast('Passwords do not match. Please verify.', 'error');
        return;
      }

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Updating password...';

        const data = await API.post(`/auth/reset-password/${encodeURIComponent(token)}`, { password });

        if (data.success) {
          Utils.showToast(data.message || 'Password reset successful! Redirecting...', 'success');
          
          // Clear any old stored token
          API.setToken(null);
          API.setUser(null);

          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1500);
        }
      } catch (err) {
        Utils.showToast(err.message || 'Failed to reset password. The link may have expired.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
